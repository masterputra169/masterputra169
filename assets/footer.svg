<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="In code we trust, in markets we hunt">
  <title>In code we trust, in markets we hunt</title>
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8" stop-opacity=".8"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
  </defs>
  <style>.p{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}</style>
  <rect x="140" y="40" width="1000" height="1.5" fill="url(#fadeL)"/>
  <g transform="translate(640 41)">
    <rect x="-9" y="-9" width="18" height="18" rx="4" transform="rotate(45)" fill="#070a12" stroke="url(#brand)" stroke-width="2"/>
    <rect x="-3.5" y="-3.5" width="7" height="7" rx="1.5" transform="rotate(45)" fill="#22d3ee" class="p"/>
  </g>
  <text x="640" y="96" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" fill="#64748b" letter-spacing=".5">“in code we trust, <tspan fill="url(#brand)" font-weight="700">in markets we hunt</tspan>”</text>
  <text x="640" y="128" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#3b4a66" letter-spacing="3">BUILT IN INDONESIA · SHIPPED ON-CHAIN</text>
</svg>
