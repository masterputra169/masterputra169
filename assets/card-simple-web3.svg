<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Simple Web3 Web — Ethereum + Base on-chain explorer surface with Privy login — readable blockchain data for people new to Web3.">
  <title>Simple Web3 Web</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".75"/><stop offset=".45" stop-color="#1c2740"/><stop offset="1" stop-color="#1c2740"/>
    </linearGradient>
    <radialGradient id="glow" cx="640" cy="0" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".16"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#172034"/></pattern>
    <clipPath id="c"><rect x="1" y="1" width="638" height="298" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="640" height="300" fill="#0c1222"/>
    <rect width="640" height="300" fill="url(#dots)" opacity=".7"/>
    <rect width="640" height="300" fill="url(#glow)"/>
    <rect x="0" y="0" width="5" height="300" fill="#60a5fa" opacity=".9"/>
  </g>
  <rect x="1" y="1" width="638" height="298" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="36" y="52" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="2"><tspan fill="#60a5fa">06</tspan><tspan fill="#64748b">  /  WEB3 · EVM</tspan></text>
  
  <g transform="translate(576 30)"><rect width="30" height="30" rx="9" fill="#070a12" stroke="#1c2740"/>
    <path d="M11 19 L19 11 M12.5 11 H19 V17.5" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="34" y="108" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="750" fill="#f1f5f9" letter-spacing="-.8">Simple Web3 Web</text>
  <text x="36" y="148" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#cbd5e1" fill-opacity=".86"><tspan x="36" dy="0">Ethereum + Base on-chain explorer surface</tspan><tspan x="36" dy="29">with Privy login — readable blockchain</tspan><tspan x="36" dy="29">data for people new to Web3.</tspan></text>
