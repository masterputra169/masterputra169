name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: masterputra169
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#6366f1&color_dots=#ebedf0,#cffafe,#67e8f9,#22d3ee,#0891b2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b2e,#164e63,#0e7490,#06b6d4,#22d3ee

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
