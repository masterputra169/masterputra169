name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: masterputra169
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00b4d8&color_dots=#ebedf0,#9be9f7,#4cd3ef,#00b4d8,#0077b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00d9ff&color_dots=#1f2335,#0f4c5c,#0a7e94,#00b4d8,#00d9ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
