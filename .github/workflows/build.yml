name: Build profile assets

# Every 15 min: live BTC header (one new 15m candle per run), GitHub activity
# card and all static SVGs (dark + light) are rebuilt and published to the
# `output` branch. The contribution snake is regenerated once a day (and on
# manual/push runs); in between, the previous snake files are carried over.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # assets
    - cron: "7 0 * * *"            # daily snake (07:07 WIB)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: profile-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install --quiet fonttools brotli

      - name: Carry over previous snake
        run: |
          mkdir -p dist
          base=https://raw.githubusercontent.com/${{ github.repository }}/output
          for f in github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg; do
            curl -fsSL --retry 3 "$base/$f" -o "dist/$f" || echo "no previous $f"
          done

      - name: Generate contribution snake
        if: github.event_name != 'schedule' || github.event.schedule == '7 0 * * *'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#4f46e5&color_dots=#eef1f6,#c7f0f7,#67d8ec,#0891b2,#155e75
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#141a2b,#164e63,#0e7490,#06b6d4,#22d3ee

      - name: Build SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comma-separated repo names to leave out of the language breakdown
          EXCLUDE_REPOS: ""
        run: python scripts/build.py --out dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "build: profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
